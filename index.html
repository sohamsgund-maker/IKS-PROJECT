<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="https://netplay-one.vercel.app/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#E50914" />
    <link rel="manifest" href="/manifest.json" />
    <title>CineVault VIP MOD — 100% Ad-Free 4K Stream</title>
    <meta name="description" content="CineVault VIP MOD - Ad-Free 4K Movies, Web Series, and Anime streaming." />
    
    <!-- VIP MOD: Anti-Ad & Popup Interception Shield -->
    <script>
      (function() {
        try {
          // Block window.open ad redirection attempts from embedded media players
          window.open = function(url, target, features) {
            console.warn('[CineVault VIP Shield] Suppressed unwanted popup/ad redirection:', url);
            return null;
          };
        } catch (e) {}
      })();
    </script>
    
    <!-- Performance Preconnect & DNS-Prefetch for Fast CDN & Image Loading -->
    <link rel="preconnect" href="https://image.tmdb.org" crossorigin />
    <link rel="dns-prefetch" href="https://image.tmdb.org" />
    <link rel="preconnect" href="https://www.2embed.cc" />
    <link rel="dns-prefetch" href="https://www.2embed.cc" />
    <link rel="preconnect" href="https://peachify.top" />
    <link rel="dns-prefetch" href="https://peachify.top" />

    <!-- Google Fonts: Inter & Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700;800;900&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-[#141414] text-zinc-100 antialiased selection:bg-[#E50914] selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
