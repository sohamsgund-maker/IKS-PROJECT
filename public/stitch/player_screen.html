<button class="px-4 py-1.5 rounded-lg bg-primary-container text-surface-container-lowest font-semibold hover:bg-primary transition-colors text-xs" id="applySheetBtn" type="button">
            Done
          </button>
</div>
</div>
</div>
</main>
<script>
    // Lightweight micro-interactions for modal sheet & player toggles
    const modalOverlay = document.getElementById('modalOverlay');
    const sheetContent = document.getElementById('sheetContent');
    const openSheetBtn = document.getElementById('openSheetBtn');
    const closeSheetBtn = document.getElementById('closeSheetBtn');
    const applySheetBtn = document.getElementById('applySheetBtn');
    const backdropDismiss = document.getElementById('backdropDismiss');
    const playPauseBtn = document.getElementById('playPauseBtn');

    function openModal() {
      modalOverlay.classList.remove('hidden', 'opacity-0', 'pointer-events-none');
      modalOverlay.classList.add('opacity-100', 'pointer-events-auto');
      sheetContent.classList.remove('translate-y-full');
      sheetContent.classList.add('translate-y-0');
      openSheetBtn.setAttribute('aria-expanded', 'true');
    }

    function closeModal() {
      sheetContent.classList.remove('translate-y-0');
      sheetContent.classList.add('translate-y-full');
      modalOverlay.classList.remove('opacity-100', 'pointer-events-auto');
      modalOverlay.classList.add('opacity-0', 'pointer-events-none');
      openSheetBtn.setAttribute('aria-expanded', 'false');
      setTimeout(() => {
        modalOverlay.classList.add('hidden');
      }, 300);
    }

    // Toggle Play/Pause Icon
    let isPlaying = true;
    playPauseBtn.addEventListener('click', () => {
      isPlaying = !isPlaying;
      const icon = playPauseBtn.querySelector('.material-symbols-outlined');
      if (isPlaying) {
        icon.textContent = 'pause';
        playPauseBtn.setAttribute('aria-label', 'Pause playback');
      } else {
        icon.textContent = 'play_arrow';
        playPauseBtn.setAttribute('aria-label', 'Resume playback');
      }
    });

    // Modal Sheet listeners
    openSheetBtn.addEventListener('click', openModal);
    closeSheetBtn.addEventListener('click', closeModal);
    applySheetBtn.addEventListener('click', closeModal);
    backdropDismiss.addEventListener('click', closeModal);
  </script>
</body></html>
