name: Build Android APK (CineVault)

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions: write-all

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Web Production Assets
        run: npm run build

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Copy Web Production Assets to Android
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -r dist/* android/app/src/main/assets/public/

      - name: Patch Plugin Compatibility
        run: node scripts/patchAdmob.cjs

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x android/gradlew

      - name: Build Android APK via Gradle
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee gradle_build.log || (echo "=== GRADLE FAILURE LOG ===" && tail -n 100 gradle_build.log && exit 1)

      - name: Rename and Prepare APK
        run: |
          mkdir -p build_output
          find android/app/build/outputs/apk/ -name "*.apk" -exec cp -v {} build_output/CineVault-v1.0.apk \;
          ls -la build_output/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CineVault-Android-APK
          path: build_output/CineVault-v1.0.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK to Release Branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan apk-release || git checkout -B apk-release
          git rm -rf . || true
          mkdir -p releases
          cp build_output/CineVault-v1.0.apk releases/CineVault-v1.0.apk
          git add -f releases/CineVault-v1.0.apk
          git commit -m "Automated build: CineVault Android APK v1.0.0"
          git push "https://x-access-token:${GH_TOKEN}@github.com/aditys4444/cinevault.git" apk-release --force || true

      - name: Create or Update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v1.0.0 build_output/CineVault-v1.0.apk --target main --title "CineVault Android App v1.0.0" --notes "Official CineVault Android APK v1.0.0 release with Google Ads monetization and bufferless streaming." --clobber || true
