name: Build Android APK (CineVault)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Web Production Assets
        run: npm run build

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Copy Web Production Assets to Android
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -r dist/* android/app/src/main/assets/public/

      - name: Patch Plugin Compatibility
        run: node scripts/patchAdmob.cjs

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x android/gradlew

      - name: Build Android APK via Gradle
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee gradle_build.log || (echo "=== GRADLE FAILURE LOG ===" && tail -n 100 gradle_build.log && exit 1)

      - name: Rename and Prepare APK
        run: |
          mkdir -p build_output
          cp android/app/build/outputs/apk/debug/app-debug.apk build_output/CineVault-v1.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CineVault-Android-APK
          path: build_output/CineVault-v1.0.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: CineVault Android App v1.0.0
          draft: false
          prerelease: false
          body: |
            ## 🎬 CineVault Official Android APK (v1.0.0)
            - **Google AdMob Verified**: Ready for Google Ads & AdMob monetization.
            - **Bufferless 4K & Real Hindi Audio**: Fast streaming servers with native multi-audio selector.
            - **Android 7.0+ Compatible**.
            
            ### 📥 Download:
            Click `CineVault-v1.0.apk` below to download and install on your Android device.
          files: |
            build_output/CineVault-v1.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
