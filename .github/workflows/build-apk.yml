name: Build Android APK (CineVault)

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions: write-all

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Web Production Assets
        run: npm run build

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Sync Web Assets with Capacitor Android
        run: npx cap sync android

      - name: Patch Plugin Compatibility
        run: node scripts/patchAdmob.cjs

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x android/gradlew

      - name: Build Android APK via Gradle
        working-directory: android
        run: |
          ./gradlew :app:assembleDebug -x lint -x test -x lintVitalRelease --stacktrace --no-daemon 2>&1 | tee ../gradle_build.log
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "=== GRADLE FAILURE DETECTED ==="
            exit 1
          fi

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle_build_log
          path: gradle_build.log
          if-no-files-found: ignore

      - name: Rename and Prepare APK
        run: |
          mkdir -p build_output
          find android/ -name "*.apk" -type f -exec cp -v {} build_output/CineVault-v1.0.apk \;
          ls -la build_output/
          if [ ! -f build_output/CineVault-v1.0.apk ]; then
            echo "Error: APK not found after gradle build!"
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CineVault-Android-APK
          path: build_output/CineVault-v1.0.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Create or Update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v1.0.0 build_output/CineVault-v1.0.apk --title "CineVault Android App v1.0.0" --notes "Official CineVault Android APK v1.0.0 release with Google Ads monetization and bufferless streaming." --clobber || true
